name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing left to prove; cancel it rather than queue it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 is the floor declared in `engines`: the first release that
        # strips types without a flag, which is what makes `node app/main.ts`
        # and `node --test test/**/*.test.ts` work at all. 24.x is what the
        # Dockerfile runs. Both are tested because the floor is a promise.
        node: ['22.18.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Offline by design: RUN_NETWORK_TESTS is unset, so nothing here touches
      # live EU infrastructure. That runs on a schedule — see network.yml.
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      # Runtime dependencies only. A devDependency advisory does not reach
      # anyone who installs this package, and failing the build on one would
      # train everybody to ignore this job.
      - run: npm audit --omit=dev --audit-level=high
