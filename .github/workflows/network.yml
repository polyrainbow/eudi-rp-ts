name: Live EU infrastructure

# The offline suite proves the verification logic. This one runs against systems
# nobody here controls, and it does two different jobs:
#
#   - Does our code still work against live infrastructure — the LOTL still
#     verifies, the reference issuer's status list and CRL are still reachable
#     and signed by anchors we trust. A failure is a bug.
#   - Is REPRODUCE.md still true — test/ecosystem-drift.test.ts. A failure means
#     nothing in src/ is broken and the EU deployment has moved: a rotated CA, a
#     stale CRL, an OCSP responder appearing, a Name Constraint in a form we do
#     not implement. Several decisions rest on measurements that would otherwise
#     go stale silently.
#
# It runs on a schedule rather than on every push for two reasons. A failure here
# is news about the EU deployment, not about the commit that triggered it — and
# every push re-fetching ~20 MB of national trust lists would be abusive toward
# the people hosting them.
on:
  schedule:
    # Mondays, off the hour: scheduled runs on the hour queue behind everybody
    # else's.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          RUN_NETWORK_TESTS: '1'
