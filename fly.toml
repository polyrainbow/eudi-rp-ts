# fly.toml app configuration file generated for eudi-rp-ts on 2026-08-10T13:09:06+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eudi-rp-ts'
primary_region = 'fra'

[build]
[env]
  # Signed request objects (JAR) with the access certificate chain in x5c.
  # The cert itself arrives via `fly secrets set ACCESS_CERT_{CHAIN,KEY}_PEM`,
  # since there is no filesystem here to point ACCESS_CERT_*_FILE at.
  # The registered RPAC carries a URI SAN, not a dNSName, and OID4VP 1.0 Final
  # has no x509_san_uri — so the identifier is the hash of the leaf and
  # CLIENT_DNS_NAME does not apply.
  BASE_URL = 'https://eudi-rp-ts.fly.dev'
  CLIENT_ID_PREFIX = 'x509_hash'
  PORT = '3000'
  REQUESTED_VCT = 'urn:eudi:pid:1'
  # The reference issuer's real anchor. The throwaway CA in
  # test/fixtures/trust-anchor.pem rejects every genuine credential with
  # ISSUER_UNTRUSTED, and the eIDAS LOTL does not carry this issuer either.
  TRUST_ANCHORS_FILE = '/app/test/fixtures/real/eudiw-pid-issuer-ca.pem'
  TRUST_MODE = 'pinned'
  WALLET_SCHEME = 'eudi-openid4vp://'
  # The reference issuer emits an mdoc validUntil that is not valid RFC 3339.
  MDOC_TOLERATE_MALFORMED_VALIDITY = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  # NOTE: this is a floor, not a cap. `fly launch` provisions two machines by
  # default, and sessions live in an in-memory Map — so the machine that creates
  # a session is often not the one the wallet posts to, and the browser sees
  # SESSION_EXPIRED for a session that exists. Pin it to one machine:
  #
  #   fly scale count 1
  #
  # Running more than one machine requires a shared session store first.
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
