services:
  verifier:
    build: .
    ports:
      - "3000:3000"
    # Above SHUTDOWN_GRACE_MS (35s). Compose's default is 10s, which would
    # SIGKILL the container part-way through draining in-flight verifications —
    # and a wallet whose post was severed cannot retry, its nonce being spent.
    stop_grace_period: 40s
    healthcheck:
      # Liveness, which is the right question for a single container with no
      # load balancer in front: /readyz would report the container unhealthy for
      # a stale trust list, and restarting it does not refresh a trust list.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    environment:
      # The URL wallets will use to reach this verifier. OID4VP requires https,
      # so for a real wallet put a tunnel in front and set this to its URL.
      BASE_URL: ${BASE_URL:-https://localhost:3000}

      # redirect_uri needs no PKI: the Client Identifier IS the response URI and
      # the request is unsigned. Switch to x509_san_dns (and supply the access
      # certificate below) to talk to the EUDI reference wallet.
      CLIENT_ID_PREFIX: ${CLIENT_ID_PREFIX:-redirect_uri}
      # CLIENT_DNS_NAME: verifier.example.org
      # ACCESS_CERT_CHAIN_FILE: /run/secrets/access-chain.pem
      # ACCESS_CERT_KEY_FILE: /run/secrets/access-key.pem

      WALLET_SCHEME: ${WALLET_SCHEME:-eudi-openid4vp://}
      REQUESTED_VCT: ${REQUESTED_VCT:-urn:eudi:pid:1}

      # DEMO ANCHOR: the EU *reference* issuer's CA, so `docker compose up`
      # works out of the box against a credential from the reference wallet.
      # It anchors a testing issuer carrying synthetic subject data — see
      # anchors/README.md. Replace it before this means anything.
      TRUST_MODE: ${TRUST_MODE:-pinned}
      TRUST_ANCHORS_FILE: ${TRUST_ANCHORS_FILE:-/app/anchors/eudiw-pid-issuer-ca.pem}

      # With TRUST_MODE=lotl these take over. Defaults to the eIDAS EU LOTL;
      # point LOTL_URL at your ecosystem's list of PID Providers instead.
      LOTL_URL: ${LOTL_URL:-https://ec.europa.eu/tools/lotl/eu-lotl.xml}
      LOTL_TERRITORIES: ${LOTL_TERRITORIES:-}
      LOTL_SERVICE_TYPES: ${LOTL_SERVICE_TYPES:-}
